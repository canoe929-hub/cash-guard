<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>記帳不漏接</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f6f7f6;--cd:#fff;--tx:#161a17;--mu:#6b746d;--ac:#1f9d55;--bd:#e1e5e2;--wa:#d9480f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--cd:#1a1c1b;--tx:#f1f3f2;--mu:#8f9a93;--ac:#2fbf6c;--bd:#2a2d2b;--wa:#ff8a5c}}
:root[data-theme="dark"]{--bg:#000;--cd:#1a1c1b;--tx:#f1f3f2;--mu:#8f9a93;--ac:#2fbf6c;--bd:#2a2d2b;--wa:#ff8a5c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:480px;margin:0 auto;padding:14px 14px calc(88px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 8px}
.pill{font-size:13px;background:var(--cd);border:1px solid var(--bd);border-radius:99px;padding:5px 11px;color:var(--mu)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
input,textarea{width:100%;padding:12px;font:inherit;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin-top:8px}
#amt{font-size:32px;font-weight:600;margin-top:12px}
textarea{height:130px;font-size:14px}
label{display:block;font-size:13px;color:var(--mu);margin-top:10px}
button{font:inherit;color:var(--tx);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button,.seg button,.link{padding:9px 13px;border-radius:99px;border:1px solid var(--bd);background:var(--bg)}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:12px;font-size:16px}
.on{background:var(--ac)!important;color:#fff!important;border-color:var(--ac)!important}
.big{width:100%;padding:15px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:17px;margin-top:10px}
.ghost{background:transparent!important;color:var(--ac)!important;border:1px solid var(--ac)!important}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.row .m{flex:1;min-width:0}.row small{color:var(--mu)}
.row input[type=checkbox]{width:26px;height:26px;margin:0;accent-color:var(--ac)}
.x{border:0;background:none;color:var(--mu);padding:6px 8px}
.done{opacity:.45;text-decoration:line-through}
.sub{font-size:13px;color:var(--mu)}.gh{margin-top:12px}
.res{font-size:22px;font-weight:600;margin:8px 0}
.wa{color:var(--wa)}.ok{color:var(--ac)}
.hide{display:none!important}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;background:var(--cd);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;padding:12px 4px;border:0;border-radius:10px;background:transparent;font-size:15px}
#toast{position:fixed;left:14px;right:14px;bottom:calc(78px + env(safe-area-inset-bottom,0px));max-width:452px;margin:0 auto;background:var(--tx);color:var(--bg);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#toast button{background:transparent;color:var(--bg);border:1px solid var(--bg);border-radius:99px;padding:6px 12px}
</style></head><body><main>
<header><h1>💵 記帳不漏接</h1><div class="pill" id="today"></div></header>

<section id="v1">
<div class="card">
<div class="seg" id="pay"><button data-p="現金" class="on">現金</button><button data-p="LINE Pay">LINE Pay</button></div>
<input id="amt" type="number" inputmode="decimal" placeholder="金額">
<div id="cashBox"><div class="chips" id="cats"></div><input id="note" type="text" placeholder="備註（選填）"></div>
<div id="lpBox" class="hide"><input id="mer" type="text" placeholder="商家"><div class="chips" id="mers"></div>
<div class="sub" style="margin-top:10px">計入卡片：<button class="link" id="cardBtn"></button></div>
<div id="cardPick" class="hide"><div class="sub" style="margin-top:8px">LINE Pay 綁的是哪張卡？卡名要和備忘錄裡的一樣，才會歸在同一組。</div><div class="chips" id="pickChips"></div>
<div style="display:flex;gap:6px"><input id="pickIn" placeholder="輸入卡名"><button class="link" id="pickAdd" style="margin-top:8px">設定</button></div></div></div>
<button class="big" id="add">記下這筆</button>
</div>
<div class="card"><h2>今天記了什麼</h2><div id="tl"></div></div>
</section>

<section id="v2" class="hide">
<div class="card"><h2>① 貼上 Apple Pay 備忘錄</h2>
<textarea id="apTxt" placeholder="11/14|7-Eleven|$64.00|卡片|applepay"></textarea>
<div class="sub gh" id="apSum"></div><div id="apList"></div><div class="res" id="apTot"></div><div class="sub wa" id="apWarn"></div>
<button class="big" id="apImp">匯入今日刷卡</button><div class="sub gh" id="apMsg"></div>
<button class="big ghost" id="apClr">清除貼上內容</button></div>
<div class="card"><h2>② 逐筆輸入天天記帳</h2>
<div class="sub" id="sum"></div><div id="list"></div>
<button class="big ghost" id="copy">複製待補清單</button><button class="big ghost" id="clr">清除已補紀錄</button></div>
</section>

<section id="v3" class="hide">
<div class="card">
<label>天天記帳「現金」帳戶餘額</label><input id="appBal" type="number" inputmode="numeric" placeholder="例：1200">
<label>錢包實際現金</label><input id="realBal" type="number" inputmode="numeric" placeholder="例：950">
<div class="sub gh" id="pendTip"></div>
<button class="big" id="chk">對帳</button><div class="res" id="res"></div><div class="sub" id="brk"></div>
<button class="big ghost hide" id="gap">把差額存進記一筆</button></div>
<div class="card"><div class="sub" id="histT">今日對帳紀錄</div><div id="hist"></div><button class="big ghost" id="more">展開全部紀錄</button></div>
</section>
</main>
<div id="toast" class="hide"><span id="tm"></span><button id="undo">復原</button></div>
<nav><button id="n1" class="on">記一筆</button><button id="n2">睡前結帳<span id="badge"></span></button><button id="n3">現金對帳</button></nav>
<script>
const CATS=["早餐","午餐","晚餐","飲料","交通","購物","其他"],$=id=>document.getElementById(id);
let items=[],hist=[],cfg={lp:""},cat="早餐",pay="現金",warned=false,armed="",lastId=0,tt,showAll=false,apRows=[],gapAmt=0,clrT=null;
const pad=n=>String(n).padStart(2,"0"),rd=n=>Math.round(n*100)/100,f=n=>rd(n).toLocaleString("zh-TW");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function load(){try{items=JSON.parse(localStorage.getItem("cg_items")||"[]");hist=JSON.parse(localStorage.getItem("cg_hist")||"[]");cfg=JSON.parse(localStorage.getItem("cg_cfg")||"{}")}catch(e){}if(cfg.lp===undefined||cfg.lp==="玉山Unitard")cfg.lp="玉山Unicard";items.forEach(i=>{if(i.card==="玉山Unitard")i.card="玉山Unicard"})}
function save(){try{localStorage.setItem("cg_items",JSON.stringify(items));localStorage.setItem("cg_hist",JSON.stringify(hist));localStorage.setItem("cg_cfg",JSON.stringify(cfg))}catch(e){}}
const isC=i=>!!i.card,ttl=i=>isC(i)?esc(i.note):esc(i.cat);
const sb=i=>i.date.slice(5).replace("-","/")+(isC(i)?" · "+esc(i.card):(i.note?" · "+esc(i.note):""))+(i.pay==="LINE Pay"&&i.card!=="LINE Pay"?" · LINE Pay":"");
const srcSort=(a,b)=>a==="現金"?-1:b==="現金"?1:a.localeCompare(b);
function toast(t){$("tm").textContent=t;$("toast").classList.remove("hide");clearTimeout(tt);tt=setTimeout(()=>$("toast").classList.add("hide"),6000)}
$("undo").onclick=()=>{items=items.filter(i=>i.id!==lastId);save();$("toast").classList.add("hide");drawAll()};

/* 記一筆 */
function setPay(p){pay=p;warned=false;$("add").textContent="記下這筆";document.querySelectorAll("#pay button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));$("cashBox").classList.toggle("hide",p!=="現金");$("lpBox").classList.toggle("hide",p!=="LINE Pay");drawForm()}
function drawForm(){$("cats").innerHTML=CATS.map(c=>`<button class="${c===cat?"on":""}" data-c="${c}">${c}</button>`).join("");
 const n={};items.filter(i=>i.pay==="LINE Pay").forEach(i=>n[i.note]=(n[i.note]||0)+1);
 $("mers").innerHTML=Object.keys(n).sort((a,b)=>n[b]-n[a]).slice(0,6).map(m=>`<button data-m="${esc(m)}">${esc(m)}</button>`).join("");
 $("cardBtn").textContent=(cfg.lp||"LINE Pay（未指定卡片）")+" ✎"}
function drawPick(){const ks=[...new Set(["玉山Unicard",...items.map(i=>i.card).filter(k=>k&&k!=="LINE Pay")])];
 $("pickChips").innerHTML=ks.map(k=>`<button data-k="${esc(k)}" class="${cfg.lp===k?"on":""}">${esc(k)}</button>`).join("")+`<button data-k="" class="${cfg.lp?"":"on"}">不指定</button>`}
$("pay").onclick=e=>{const p=e.target.dataset.p;if(p)setPay(p)};
$("cats").onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;warned=false;drawForm()}};
$("mers").onclick=e=>{const m=e.target.dataset.m;if(m!==undefined)$("mer").value=m};
$("cardBtn").onclick=()=>{$("cardPick").classList.toggle("hide");drawPick()};
$("pickChips").onclick=e=>{const b=e.target.closest("button");if(!b)return;cfg.lp=b.dataset.k;save();drawForm();drawPick()};
$("pickAdd").onclick=()=>{const v=$("pickIn").value.trim();if(v){cfg.lp=v;$("pickIn").value="";save();drawForm();drawPick()}};
["amt","mer","note"].forEach(id=>$(id).oninput=()=>{if(warned){warned=false;$("add").textContent="記下這筆"}});
$("add").onclick=()=>{const a=rd(parseFloat($("amt").value));if(!(a>0)){$("amt").focus();return}
 const d=today(),lp=pay==="LINE Pay",m=lp?($("mer").value.trim()||"LINE Pay消費"):"";
 const it=lp?{amt:a,cat:"刷卡",note:m,card:cfg.lp||"LINE Pay",pay:"LINE Pay"}:{amt:a,cat,note:$("note").value.trim(),pay:"現金"};
 if(!warned&&items.find(x=>x.date===d&&x.amt===a&&x.pay===it.pay&&x.note===it.note&&x.cat===it.cat&&Date.now()-x.id<18e4)){warned=true;$("add").textContent="3 分鐘內有相同一筆，仍要記下？";return}
 warned=false;it.id=Date.now();it.date=d;it.done=false;items.push(it);lastId=it.id;save();
 $("amt").value="";$("mer").value="";$("note").value="";$("add").textContent="記下這筆";
 toast("已記錄："+(lp?m:cat)+" "+f(a)+" 元");drawAll();$("amt").focus()};
function drawToday(){const t=items.filter(i=>i.date===today()).reverse();
 $("today").textContent=`今日 ${t.length} 筆 · ${f(t.reduce((a,b)=>a+b.amt,0))}`;
 $("tl").innerHTML=t.map(i=>`<div class="row"><div class="m">${ttl(i)} <b>${f(i.amt)}</b> 元<br><small>${sb(i)}</small></div><button class="x" data-del="${i.id}">${armed==i.id?"確定刪？":"✕"}</button></div>`).join("")||'<div class="sub">今天還沒有紀錄</div>'}
$("tl").onclick=e=>{const id=e.target.dataset.del;if(!id)return;
 if(armed==id){items=items.filter(i=>String(i.id)!==id);armed="";save();drawAll()}else{armed=id;drawToday();setTimeout(()=>{if(armed==id){armed="";drawToday()}},3000)}};

/* 睡前結帳 */
function apParse(){const md=today().slice(5).replace("-","/"),rows=[];let other=0,bad=[];
 $("apTxt").value.split(/\r?\n/).forEach(r=>{r=r.trim();if(!r)return;const p=r.split("|").map(x=>x.trim()),a=parseFloat((p[2]||"").replace(/[^0-9.]/g,""));
  if(p.length<3||!/^\d{1,2}\/\d{1,2}$/.test(p[0])||!(a>0)){bad.push(r);return}
  if(p[0].split("/").map(n=>pad(+n)).join("/")!==md){other++;return}
  rows.push({m:p[1],a,c:p[3]||"未知卡"})});
 apRows=rows;const g={};rows.forEach(x=>(g[x.c]=g[x.c]||[]).push(x));
 $("apList").innerHTML=Object.keys(g).sort().map(k=>`<div class="sub gh"><b>${esc(k)}</b>　${g[k].length} 筆 / ${f(g[k].reduce((t,x)=>t+x.a,0))} 元</div>`+g[k].map(x=>`<div class="row"><div class="m">${esc(x.m)}</div><b>${f(x.a)}</b></div>`).join("")).join("")||'<div class="sub gh">今天沒有刷卡紀錄</div>';
 $("apSum").textContent=rows.length?`今日 ${md} 共 ${rows.length} 筆`:"";
 $("apTot").textContent=rows.length?`合計 ${f(rows.reduce((t,x)=>t+x.a,0))} 元`:"";
 $("apWarn").innerHTML=(other?`其他日期 ${other} 筆未計入`:"")+(bad.length?`${other?"<br>":""}${bad.length} 行格式不符，未計入：<br>${bad.map(esc).join("<br>")}`:"")}
function apImport(){apParse();let log={};try{log=JSON.parse(localStorage.getItem("cg_imp")||"{}")}catch(e){}
 const seen={},d=today();let add=0,skip=0;
 apRows.forEach(x=>{const k=[d,x.c,x.m,x.a].join("|");seen[k]=(seen[k]||0)+1;if(seen[k]<=(log[k]||0)){skip++;return}
  items.push({id:Date.now()+add,amt:x.a,cat:"刷卡",note:x.m,card:x.c,pay:"刷卡",date:d,done:false});add++});
 Object.keys(seen).forEach(k=>{log[k]=Math.max(log[k]||0,seen[k])});
 const c=new Date(Date.now()-14*864e5),ck=c.getFullYear()+"-"+pad(c.getMonth()+1)+"-"+pad(c.getDate());
 Object.keys(log).forEach(k=>{if(k.slice(0,10)<ck)delete log[k]});
 try{localStorage.setItem("cg_imp",JSON.stringify(log))}catch(e){}
 if(add){save();drawAll()}
 $("apMsg").textContent=add||skip?`新增 ${add} 筆到待補清單${skip?`，略過已匯入 ${skip} 筆`:""}`:"今天沒有可匯入的刷卡紀錄"}
$("apImp").onclick=apImport;
$("apTxt").oninput=()=>{try{localStorage.setItem("cg_ap",$("apTxt").value)}catch(e){}apParse()};
$("apClr").onclick=()=>{$("apTxt").value="";try{localStorage.removeItem("cg_ap")}catch(e){}apParse()};
function rowHtml(i){return `<div class="row"><input type="checkbox" data-id="${i.id}" ${i.done?"checked":""}><div class="m ${i.done?"done":""}">${ttl(i)} <b>${f(i.amt)}</b> 元<br><small>${sb(i)}</small></div></div>`}
function listHtml(){const g={};items.slice().reverse().slice(0,80).forEach(i=>{const k=i.card||"現金";(g[k]=g[k]||[]).push(i)});
 return Object.keys(g).sort(srcSort).map(k=>{const p=g[k].filter(i=>!i.done);return `<div class="sub gh"><b>${esc(k)}</b>　${p.length?`待補 ${p.length} 筆 / ${f(p.reduce((a,b)=>a+b.amt,0))} 元`:"全部已補 ✓"}</div>`+g[k].map(rowHtml).join("")}).join("")||'<div class="sub">還沒有紀錄</div>'}
function drawList(){const p=items.filter(i=>!i.done);
 $("sum").textContent=p.length?`還有 ${p.length} 筆沒補進天天記帳，共 ${f(p.reduce((a,b)=>a+b.amt,0))} 元`:"全部都補進去了 ✓";
 $("badge").textContent=p.length?" ("+p.length+")":"";$("list").innerHTML=listHtml()}
$("list").onchange=e=>{const i=items.find(x=>x.id===+e.target.dataset.id);if(i){i.done=e.target.checked;save();drawAll()}};
function buildText(){const p=items.filter(i=>!i.done);if(!p.length)return "沒有待補項目";const g={};p.forEach(i=>{const k=i.card||"現金";g[k]=g[k]||{};(g[k][i.date]=g[k][i.date]||[]).push(i)});let all=0;const L=[];
 Object.keys(g).sort(srcSort).forEach(k=>{L.push("【"+k+"】");Object.keys(g[k]).sort().forEach(d=>{const t=g[k][d].reduce((a,b)=>a+b.amt,0);all+=t;L.push(d);g[k][d].forEach(i=>L.push(`  ${isC(i)?i.note:i.cat} ${i.amt}${!isC(i)&&i.note?" "+i.note:""}`));L.push(`  ➜ 當日合計 ${rd(t)} 元`)});L.push("")});
 L.push(`總計 ${p.length} 筆，共 ${rd(all)} 元`);return L.join("\n")}
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(buildText());$("copy").textContent="已複製 ✓"}catch(e){$("copy").textContent="請手動長按選取"}setTimeout(()=>$("copy").textContent="複製待補清單",1500)};
$("clr").onclick=()=>{const n=items.filter(i=>i.done).length;
 if(!n){$("clr").textContent="目前沒有已補紀錄";setTimeout(()=>$("clr").textContent="清除已補紀錄",1500);return}
 if(!clrT){$("clr").textContent=`再按一次，確認清除 ${n} 筆`;clrT=setTimeout(()=>{clrT=null;$("clr").textContent="清除已補紀錄"},3000);return}
 clearTimeout(clrT);clrT=null;items=items.filter(i=>!i.done);save();drawAll();$("clr").textContent="已清除 ✓";setTimeout(()=>$("clr").textContent="清除已補紀錄",1500)};

/* 現金對帳 */
function histView(){$("histT").textContent=showAll?"全部對帳紀錄":"今日對帳紀錄";$("more").textContent=showAll?"收合，只看今天":"展開全部紀錄";return showAll?hist.slice().reverse():hist.filter(h=>h.date===today()).reverse()}
function drawRec(){const pc=items.filter(i=>!i.done&&!i.card);
 $("pendTip").textContent=pc.length?`還有現金 ${f(pc.reduce((a,b)=>a+b.amt,0))} 元尚未補進天天記帳，對帳時會自動扣除，避免重複計算`:"";
 $("hist").innerHTML=histView().map(h=>`<div class="row"><div class="m">${h.date}<br><small>帳上 ${h.app}${h.pend?" − 待補 "+h.pend:""} / 實際 ${h.real}</small></div><b class="${h.diff<0?"wa":"ok"}">${h.diff>0?"+":""}${h.diff}</b></div>`).join("")||'<div class="sub">'+(hist.length?"今天還沒對帳":"尚無紀錄")+'</div>'}
$("more").onclick=()=>{showAll=!showAll;drawRec()};
$("chk").onclick=()=>{const a=parseInt($("appBal").value,10),r=parseInt($("realBal").value,10);if(isNaN(a)||isNaN(r))return;
 const pend=rd(items.filter(i=>!i.done&&!i.card).reduce((x,y)=>x+y.amt,0)),d=rd(r-(a-pend));hist.push({date:today(),app:a,pend,real:r,diff:d});save();drawRec();
 $("brk").textContent=`帳上 ${a}${pend?` − 待補 ${pend}`:""} = 預期現金 ${rd(a-pend)}；實際 ${r}`;
 if(d<0){$("res").className="res wa";$("res").textContent=`漏記了約 ${-d} 元`;gapAmt=-d;$("gap").classList.remove("hide")}
 else if(d>0){$("res").className="res wa";$("res").textContent=`錢包多了 ${d} 元（可能少記收入或找零）`;$("gap").classList.add("hide")}
 else{$("res").className="res ok";$("res").textContent="帳目完全吻合 🎉";$("gap").classList.add("hide")}};
$("gap").onclick=()=>{items.push({id:Date.now(),amt:gapAmt,cat:"其他",note:"對帳差額（未明現金支出）",pay:"現金",date:today(),done:false});save();drawAll();$("gap").classList.add("hide");show(1)};

function drawAll(){drawForm();drawToday();drawList();drawRec()}
function show(n){[1,2,3].forEach(i=>{$("v"+i).classList.toggle("hide",i!==n);$("n"+i).classList.toggle("on",i===n)});if(n===2)apParse();window.scrollTo(0,0)}
[1,2,3].forEach(i=>$("n"+i).onclick=()=>show(i));
load();try{$("apTxt").value=localStorage.getItem("cg_ap")||""}catch(e){}apParse();setPay("現金");drawAll();
</script></body></html>
