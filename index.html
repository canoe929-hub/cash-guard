<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>現金不漏記</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f6;--card:#fff;--tx:#161a17;--mut:#6b746d;--ac:#1f9d55;--bd:#e1e5e2;--warn:#d9480f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1a1c1b;--tx:#f1f3f2;--mut:#8f9a93;--ac:#2fbf6c;--bd:#2a2d2b;--warn:#ff8a5c}}
:root[data-theme="dark"]{--bg:#000;--card:#1a1c1b;--tx:#f1f3f2;--mut:#8f9a93;--ac:#2fbf6c;--bd:#2a2d2b;--warn:#ff8a5c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
input[type=number],input[type=text]{width:100%;padding:12px;font-size:20px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips button{padding:8px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:14px}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.big{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:17px;margin-top:8px}
.ghost{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}
.row .m{flex:1}.row small{color:var(--mut)}
.row input{width:22px;height:22px;accent-color:var(--ac)}
.done{opacity:.45;text-decoration:line-through}
.sum{font-size:14px;color:var(--mut);margin-bottom:8px}
.res{font-size:22px;font-weight:600;margin:8px 0}
.warn{color:var(--warn)}.ok{color:var(--ac)}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>💵 現金不漏記</h1>
<div class="tabs"><button id="t1" class="on">隨手記</button><button id="t2">每晚對帳</button></div>

<section id="p1">
<div class="card">
<input id="amt" type="number" inputmode="numeric" placeholder="金額">
<div class="chips" id="cats"></div>
<input id="note" type="text" placeholder="備註（選填）" style="font-size:16px">
<button class="big" id="add">記下這筆現金</button>
</div>
<div class="card">
<div class="sum" id="sum"></div>
<div id="list"></div>
<button class="big ghost" id="copy">複製待補清單</button>
<button class="big ghost" id="clr">清除已補紀錄</button>
</div>
</section>

<section id="p2" class="hide">
<div class="card">
<label>天天記帳「現金」帳戶餘額</label>
<input id="appBal" type="number" inputmode="numeric" placeholder="例：1200">
<label>錢包實際現金</label>
<input id="realBal" type="number" inputmode="numeric" placeholder="例：950">
<button class="big" id="chk">對帳</button>
<div class="res" id="res"></div>
<button class="big ghost hide" id="gap">把差額存進隨手記</button>
</div>
<div class="card"><div class="sum">最近對帳紀錄</div><div id="hist"></div></div>
</section>
</main>
<script>
const CATS=["早餐","午餐","晚餐","飲料","交通","購物","其他"];
let items=[],hist=[],cat="早餐",gapAmt=0;
function load(){try{items=JSON.parse(localStorage.getItem("cg_items")||"[]");hist=JSON.parse(localStorage.getItem("cg_hist")||"[]")}catch(e){items=[];hist=[]}}
function save(){try{localStorage.setItem("cg_items",JSON.stringify(items));localStorage.setItem("cg_hist",JSON.stringify(hist))}catch(e){}}
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function drawCats(){$("cats").innerHTML=CATS.map(c=>`<button class="${c===cat?"on":""}" data-c="${c}">${c}</button>`).join("")}
$("cats").onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;drawCats()}};
function draw(){
 const p=items.filter(i=>!i.done),s=p.reduce((a,b)=>a+b.amt,0);
 $("sum").textContent=p.length?`還有 ${p.length} 筆沒補進天天記帳，共 ${s} 元`:"全部都補進去了 ✓";
 $("list").innerHTML=items.slice().reverse().slice(0,30).map(i=>`<div class="row"><input type="checkbox" data-id="${i.id}" ${i.done?"checked":""}><div class="m ${i.done?"done":""}">${esc(i.cat)} ${i.amt} 元<br><small>${i.date}${i.note?" · "+esc(i.note):""}</small></div></div>`).join("")||'<small style="color:var(--mut)">還沒有紀錄</small>';
 $("hist").innerHTML=hist.slice().reverse().slice(0,7).map(h=>`<div class="row"><div class="m">${h.date}<br><small>帳上 ${h.app} / 實際 ${h.real}</small></div><b class="${h.diff<0?"warn":"ok"}">${h.diff>0?"+":""}${h.diff}</b></div>`).join("")||'<small style="color:var(--mut)">尚無紀錄</small>';
}
$("add").onclick=()=>{const a=parseInt($("amt").value,10);if(!a||a<=0){$("amt").focus();return}
 items.push({id:Date.now(),amt:a,cat,note:$("note").value.trim(),date:today(),done:false});
 $("amt").value="";$("note").value="";save();draw();$("amt").focus()};
$("list").onchange=e=>{const id=+e.target.dataset.id;const i=items.find(x=>x.id===id);if(i){i.done=e.target.checked;save();draw()}};
let clrT=null;
$("clr").onclick=()=>{const n=items.filter(i=>i.done).length;
 if(!n){$("clr").textContent="目前沒有已補紀錄";setTimeout(()=>$("clr").textContent="清除已補紀錄",1500);return}
 if(!clrT){$("clr").textContent=`再按一次，確認清除 ${n} 筆`;clrT=setTimeout(()=>{clrT=null;$("clr").textContent="清除已補紀錄"},3000);return}
 clearTimeout(clrT);clrT=null;items=items.filter(i=>!i.done);save();draw();$("clr").textContent="已清除 ✓";setTimeout(()=>$("clr").textContent="清除已補紀錄",1500)};
function buildText(){const p=items.filter(i=>!i.done);if(!p.length)return "沒有待補項目";const g={};p.forEach(i=>{(g[i.date]=g[i.date]||[]).push(i)});let all=0;const L=[];
 Object.keys(g).sort().forEach(d=>{const s=g[d].reduce((a,b)=>a+b.amt,0);all+=s;L.push(d);g[d].forEach(i=>L.push(`  ${i.cat} ${i.amt}${i.note?" "+i.note:""}`));L.push(`  ➜ 當日現金合計 ${s} 元`,"")});
 L.push(`總計 ${p.length} 筆，共 ${all} 元`);return L.join("\n")}
$("copy").onclick=async()=>{const t=buildText();
 try{await navigator.clipboard.writeText(t);$("copy").textContent="已複製 ✓"}catch(e){$("copy").textContent="請手動長按選取"}
 setTimeout(()=>$("copy").textContent="複製待補清單",1500)};
const unusedExport=async()=>{const L=["【現金記錄】"+today(),""];items.forEach(i=>L.push(`${i.date} ${i.cat} ${i.amt}${i.note?" "+i.note:""} ${i.done?"[已補]":"[待補]"}`));L.push("","【對帳紀錄】");hist.forEach(h=>L.push(`${h.date} 帳上${h.app} 實際${h.real} 差額${h.diff}`));
 const f=new File([L.join("\n")],"cash-"+today()+".txt",{type:"text/plain"});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==="AbortError")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove()};
$("chk").onclick=()=>{const a=parseInt($("appBal").value,10),r=parseInt($("realBal").value,10);if(isNaN(a)||isNaN(r))return;
 const d=r-a;hist.push({date:today(),app:a,real:r,diff:d});save();draw();
 if(d<0){$("res").className="res warn";$("res").textContent=`漏記了約 ${-d} 元`;gapAmt=-d;$("gap").classList.remove("hide")}
 else if(d>0){$("res").className="res warn";$("res").textContent=`錢包多了 ${d} 元（可能少記收入或找零）`;$("gap").classList.add("hide")}
 else{$("res").className="res ok";$("res").textContent="帳目完全吻合 🎉";$("gap").classList.add("hide")}};
$("gap").onclick=()=>{items.push({id:Date.now(),amt:gapAmt,cat:"其他",note:"對帳差額（未明現金支出）",date:today(),done:false});save();draw();$("gap").classList.add("hide");show(1)};
function show(n){$("p1").classList.toggle("hide",n!==1);$("p2").classList.toggle("hide",n!==2);$("t1").classList.toggle("on",n===1);$("t2").classList.toggle("on",n===2)}
$("t1").onclick=()=>show(1);$("t2").onclick=()=>show(2);
load();drawCats();draw();
</script>
</body>
</html>
